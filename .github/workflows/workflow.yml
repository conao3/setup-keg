name: Main workflow
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        keg_version:
          - 'snapshot'
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24.x

    - uses: purcell/setup-emacs@v8.0
      with:
        version: 31.1

    - run: yarn install
    - run: yarn run format-check
    - run: yarn test

    - uses: ./
      with:
        version: ${{ matrix.keg_version }}
